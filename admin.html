<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - becominganengineer.in</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Private admin page for publishing posts. Not linked from the site.">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    };
  </script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>

<body class="bg-[#06080F] text-slate-200 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-xl">
    <div class="flex items-center justify-between mb-6">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-emerald-500/10 text-emerald-500 flex items-center justify-center font-bold">+</div>
        <div>
          <h1 class="text-lg font-bold text-white">Publish New SDET Post</h1>
          <p class="text-xs text-slate-400">Writes directly to the GitHub repo. Only you have the token.</p>
        </div>
      </div>
      <a href="index.html" class="text-xs text-slate-400 hover:text-emerald-400 transition flex items-center gap-1">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Blog
      </a>
    </div>

    <form onsubmit="handleCreatePost(event)" class="space-y-3.5 bg-[#111726] border border-slate-800 rounded-2xl p-6">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Post Title</label>
        <input type="text" id="new-title" required placeholder="e.g. Solving StaleElement Exceptions in Playwright Dynamic Tables"
               class="w-full px-3.5 py-2.5 rounded-lg bg-[#06080F] border border-slate-800 text-sm text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Read Time</label>
          <input type="text" id="new-readtime" placeholder="e.g. 5 min read" value="5 min read"
                 class="w-full px-3.5 py-2 rounded-lg bg-[#06080F] border border-slate-800 text-xs text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Tags (Comma-separated)</label>
          <input type="text" id="new-tags" required placeholder="Playwright, Locators, Flakiness"
                 class="w-full px-3.5 py-2 rounded-lg bg-[#06080F] border border-slate-800 text-xs text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Short Summary</label>
        <textarea id="new-summary" rows="2" required placeholder="Brief description of the problem, fix, or concept learned..."
                  class="w-full px-3.5 py-2.5 rounded-lg bg-[#06080F] border border-slate-800 text-xs text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none"></textarea>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Code Snippet / Test Blueprint</label>
        <textarea id="new-code" rows="6" placeholder="// Paste your test script or locator snippet here..."
                  class="w-full font-mono text-xs px-3.5 py-2.5 rounded-lg bg-[#06080F] border border-slate-800 text-slate-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none"></textarea>
      </div>

      <div class="pt-3 flex items-center justify-end gap-2 border-t border-slate-800">
        <button type="reset" class="px-4 py-2 text-xs font-semibold rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition">
          Clear
        </button>
        <button type="submit" class="px-5 py-2 text-xs font-semibold rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white transition shadow-sm">
          Publish to Blog
        </button>
      </div>
    </form>

    <p class="text-[11px] text-slate-500 mt-4 text-center">
      This page is not linked from the blog and is hidden from search engines.<br>
      Publishing still needs your GitHub token, asked once per browser session.
    </p>
  </div>

  <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-24 opacity-0 transition-all duration-300 pointer-events-none flex items-center gap-3 px-4 py-3 rounded-xl bg-slate-900 border border-emerald-500/40 text-white text-xs shadow-2xl">
    <i data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i>
    <span id="toast-message">Notification</span>
  </div>

  <script>
    // Publish straight to GitHub: creates posts/<slug>.md in the
    // dev-arjun/engineerFE repo via the GitHub Contents API.
    // Needs a fine-grained personal access token (Contents: read + write
    // on this repo); asked once per browser session and kept only in
    // sessionStorage, never in the repo.
    // Note: this saves the Markdown file. The live site refreshes after
    // docs/ is rebuilt (python3 build.py docs) and pushed.
    const GH_OWNER = 'dev-arjun';
    const GH_REPO = 'engineerFE';
    const GH_BRANCH = 'main';

    function ghSlugify(title) {
      const s = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60);
      return s || ('post-' + Date.now());
    }

    function ghBase64(str) {
      const bytes = new TextEncoder().encode(str);
      let bin = '';
      for (const b of bytes) bin += String.fromCharCode(b);
      return btoa(bin);
    }

    function fmEscape(s) {
      return String(s).replace(/\\/g, '\\\\').replace(/"/g, "'");
    }

    async function handleCreatePost(e) {
      e.preventDefault();
      const title = document.getElementById('new-title').value.trim();
      const readTime = document.getElementById('new-readtime').value.trim() || '5 min read';
      const rawTags = document.getElementById('new-tags').value.trim();
      const summary = document.getElementById('new-summary').value.trim();
      const code = document.getElementById('new-code').value.trim();

      if (!title || !rawTags || !summary) return;

      const parsedTags = rawTags
        .split(',')
        .map(t => t.trim().replace(/^#/, ''))
        .filter(t => t.length > 0);

      let ghToken = sessionStorage.getItem('sdet_gh_token');
      if (!ghToken) {
        ghToken = prompt('Enter your GitHub token to publish (kept only in this browser session):');
        if (!ghToken) return;
        ghToken = ghToken.trim();
        sessionStorage.setItem('sdet_gh_token', ghToken);
      }

      const slug = ghSlugify(title);
      const date = new Date().toISOString().split('T')[0];
      const md =
        '---\n' +
        'title: "' + fmEscape(title) + '"\n' +
        'date: ' + date + '\n' +
        (parsedTags.length ? 'tags: "' + fmEscape(parsedTags.join(', ')) + '"\n' : '') +
        'description: "' + fmEscape(summary) + '"\n' +
        'readtime: "' + fmEscape(readTime) + '"\n' +
        '---\n\n' +
        summary + '\n' +
        (code ? '\n```\n' + code.replace(/```/g, "'''") + '\n```\n' : '');

      const submitBtn = e.target.querySelector('button[type="submit"]');
      const originalLabel = submitBtn.textContent;
      submitBtn.disabled = true;
      submitBtn.textContent = 'Publishing...';

      const headers = {
        'Authorization': 'Bearer ' + ghToken,
        'Accept': 'application/vnd.github+json'
      };
      const url = 'https://api.github.com/repos/' + GH_OWNER + '/' + GH_REPO + '/contents/posts/' + slug + '.md';

      try {
        const existing = await fetch(url, { headers });
        if (existing.status === 200) throw new Error('A post with this title already exists.');
        if (existing.status === 401) {
          sessionStorage.removeItem('sdet_gh_token');
          throw new Error('Token rejected by GitHub. Try again.');
        }
        if (existing.status !== 404) throw new Error('Could not reach GitHub (HTTP ' + existing.status + ').');

        const put = await fetch(url, {
          method: 'PUT',
          headers: Object.assign({}, headers, { 'Content-Type': 'application/json' }),
          body: JSON.stringify({
            message: 'Add post: ' + title,
            content: ghBase64(md),
            branch: GH_BRANCH
          })
        });
        if (put.status === 401) {
          sessionStorage.removeItem('sdet_gh_token');
          throw new Error('Token rejected by GitHub. Try again.');
        }
        if (!put.ok) throw new Error('GitHub refused the file (HTTP ' + put.status + ').');

        e.target.reset();
        showToast('Saved to GitHub! It goes live after the next site rebuild.');
      } catch (err) {
        showToast('Publish failed: ' + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = originalLabel;
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-message').textContent = msg;
      toast.classList.remove('translate-y-24', 'opacity-0');
      setTimeout(() => toast.classList.add('translate-y-24', 'opacity-0'), 3500);
    }

    if (window.lucide) lucide.createIcons();
  </script>
</body>
</html>
